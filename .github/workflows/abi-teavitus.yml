name: Abi teavitus

on:
  issues:
    types: [labeled, opened]

permissions:
  issues: write

jobs:
  abi:
    if: contains(github.event.issue.labels.*.name, 'abi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.issue.number;
            const k = await github.rest.issues.listComments({ owner, repo, issue_number: n });
            if (k.data.some(c => (c.body || '').includes('abipäring'))) return;
            await github.rest.issues.createComment({ owner, repo, issue_number: n,
              body: '@mariahkhk - abipäring. Kirjelda, mida proovisid ja mis veateade tuli.' });
